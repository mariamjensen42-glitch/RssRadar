<!doctype html>
<!--
  PROTOTYPE — NOT PRODUCTION CODE.  Throwaway.
  Question: 以 RSSHub 为核心的 RSS 阅读器，主界面该长什么样？
            —— 具体说：RSSHub 的「路由发现 + 参数构建」应该占据主屏，还是藏在信息流背后的入口？
  Variants (three structurally different answers):
    A 路由市场优先     — 首屏就是 RSSHub 路由目录，信息流是第二个 tab
    B 信息流优先+抽屉  — 首屏是信息流，RSSHub 从 FAB 底部抽屉进入
    C 智能输入+瀑布流  — 顶部万能输入条解析任意链接/平台词，阅读与构建同屏
  Switch: ?variant=A|B|C · ← → 方向键 · 底部悬浮条
-->

  .ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .t1{color:var(--t1)}.t3{color:var(--t3)}
  .sv{width:18px;height:18px;display:block}

  }

  /* ---- sheet ---- */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:8}

const FEEDS = [
  {id:1, name:'影视飓风',      route:'bili-dyn',  c:'#FB7299', unread:12, tag:'视频'},
  {id:2, name:'JetBrains/kotlin',route:'gh-rel', c:'#C9D1D9', unread:3,  tag:'技术'},

const ARTICLES = [

const hub = 'https://rsshub.app';

/* ============================ state ============================ */
const S = {
  variant:'A',
  tab:'discover',       // A: discover|feed|subs|me
  bTab:'feed',          // B
  cTab:'all',           // C: all|discover
  cat:'全部',
  query:'',
  route:null,           // 正在配置的 route id
  params:{},            // {key: value}
  url:null,             // 生成的 URL
  preview:false,
  sheet:null,           // B: null|'catalog'|'form'
  subscribed:FEEDS.map(f=>f.id),
  smart:'',
  parsed:null,
  toast:'',
};
const R = id => ROUTES.find(r=>r.id===id);

function buildUrl(route, params){
  if(!route) return null;
  let p = route.path;
  route.params.forEach(({k,ex})=>{ p = p.replace(':'+k, encodeURIComponent((params[k]||'').trim() || ex)); });
  return hub + p;
}
function fillMissing(){
  const r = R(S.route); if(!r) return;
  r.params.forEach(({k,ex})=>{ if(S.params[k]===undefined) S.params[k]=ex; });
}

/* 智能解析输入：识别平台词 / 链接 → 路由 + 参数 */
function parseSmart(q){
  const raw=(q||'').trim(); if(!raw) return null;
  const s=raw.toLowerCase();
  const m = {
    'bilibili.com':{id:'bili-dyn', grab:/space\.bilibili\.com\/(\d+)/, key:'uid'},
    'b23.tv':{id:'bili-dyn', grab:/b23\.tv\/(\w+)/, key:'uid'},
    'weibo.com':{id:'weibo', grab:/weibo\.com\/u?\/(\d+)/, key:'uid'},
    'github.com':{id:'gh-rel', grab:/github\.com\/([\w.-]+)\/([\w.-]+)/, keys:['owner','repo']},
    'v2ex.com':{id:'v2ex', grab:/v2ex\.com\/go\/(\w+)/, key:'node'},
    'youtube.com':{id:'yt', grab:/channel\/([\w-]+)/, key:'id'},
    'x.com':{id:'tw', grab:/x\.com\/(\w+)/, key:'id'},
    'twitter.com':{id:'tw', grab:/(?:twitter|x)\.com\/(\w+)/, key:'id'},
    'zhihu.com':{id:'zhihu-col', grab:/zhihu\.com\/collection\/(\d+)/, key:'id'},
  };
  for(const host in m){
    if(!s.includes(host)) continue;
    const cfg = m[host], r = R(cfg.id), got = raw.match(cfg.grab);
    if(got && cfg.keys){ const out={}; cfg.keys.forEach((k,i)=>out[k]=got[i+1]||''); return {route:r, params:out, auto:true}; }
    if(got && cfg.key)  return {route:r, params:{[cfg.key]:got[1]}, auto:true};
    return {route:r, params:{}, auto:false};
  }
  const words = {bili:['bili','bilibili','b站','哔哩'], weibo:['weibo','微博'], github:['github','gh','仓库'],
                 v2ex:['v2ex','节点'], zhihu:['知乎'], youtube:['youtube','yt','油管'], twitter:['twitter','x.com','推特']};
  const map = {bili:'bili-dyn', weibo:'weibo', github:'gh-rel', v2ex:'v2ex', zhihu:'zhihu-col', youtube:'yt', twitter:'tw'};
  for(const w in words){ if(words[w].some(t=>s.includes(t))) return {route:R(map[w]), params:{}, auto:false}; }
  const byName = ROUTES.find(r=>s.includes(r.name.toLowerCase().split(' ')[0]));
  if(byName) return {route:byName, params:{}, auto:false};
  return null;
}

  A:{name:'路由市场优先', render:renderA,
     desc:'<b>首屏即路由目录。</b>底部 4 tab，「发现」是默认页：大标题 + 搜索 + 分类 chips + 2 列热门路由卡片；点卡片进详情页填参数、预览、订阅。<br><br>赌的是：用户来这儿就是为了<b>用 RSSHub 挖新源</b>，阅读是次要动作。'},
  B:{name:'信息流优先 + 抽屉', render:renderB,
     desc:'<b>首屏是信息流</b>，标准阅读器布局（未读数 + 分段筛选 + 列表）。RSSHub 藏在右下 FAB 的<b>底部抽屉</b>里：搜索 → 分类 → 纵向路由列表 → 参数表单都在 sheet 内完成。<br><br>赌的是：日常动作是<b>读</b>，加源是低频动作，不该占主屏。'},
  C:{name:'智能输入 + 瀑布流', render:renderC,
     desc:'<b>顶部万能输入条</b>：粘贴 b站主页 / GitHub 仓库链接，自动识别路由并回填参数（标「已识别」）；认不出时直接搜平台词。阅读区是<b>双列瀑布流</b>，构建卡片与阅读同屏。<br><br>赌的是：路由表太长了，<b>不该让用户去翻</b>，该让输入框去猜。'},
};

/* ============================ 渲染 & 事件 ============================ */
const screen = document.getElementById('screen');
const swLabel = document.getElementById('swLabel');

function render(){
  const v = VARIANTS[S.variant];
  screen.innerHTML = v.render();
  swLabel.innerHTML = `<span class="tag">PROTOTYPE</span><span>${S.variant}</span><small>${v.name}</small>`;
  document.getElementById('variantDesc').innerHTML = v.desc;
  document.getElementById('state').textContent = JSON.stringify({
    variant:S.variant, tab:S.tab, bTab:S.bTab, cTab:S.cTab, cat:S.cat,
    query:S.query||'(空)', smart:S.smart||'(空)',
    route:S.route||null, params:S.params, url:S.url, preview:S.preview,
    sheet:S.sheet, subscribedCount:S.subscribed.length
  }, null, 1);
  const url = new URL(location.href);
  if(url.searchParams.get('variant')!==S.variant){ url.searchParams.set('variant',S.variant); history.replaceState(null,'',url); }
}

function go(d){
  const keys = Object.keys(VARIANTS);
  const i = keys.indexOf(S.variant);
  S.variant = keys[(i + d + keys.length) % keys.length];
  // 切变体时重置各自的局部视图状态
  S.route=null; S.params={}; S.url=null; S.preview=false; S.sheet=null; S.parsed=null;
  render();
}

/* 事件委托 */
screen.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, key = el.dataset.key;

  if(act==='nav'){ S.tab=key; S.bTab=key; render(); }
  else if(act==='cat'){ S.cat=key; render(); }
  else if(act==='openRoute'){ S.route=key; S.params={}; S.url=null; S.preview=false; render(); }
  else if(act==='closeRoute'){ S.route=null; S.params={}; S.url=null; S.preview=false; render(); }
  else if(act==='openSheet'){ S.sheet='catalog'; render(); }
  else if(act==='closeSheet'){ S.sheet=null; S.route=null; S.params={}; S.url=null; S.preview=false; render(); }
  else if(act==='backCatalog'){ S.route=null; S.params={}; S.url=null; S.preview=false; render(); }
  else if(act==='preview'){
    fillMissing();
    S.url = buildUrl(R(S.route), S.params);
    S.preview = true; render();
  }
  else if(act==='subscribe'){
    if(!S.subscribed.includes(S.route)) S.subscribed.push(S.route);
    S.toast='已订阅'; render();
  }
  else if(act==='copyUrl'){ S.toast='已复制'; render(); }
  else if(act==='cTab'){ S.cTab=key; render(); }
  else if(act==='pickC'){ S.parsed={route:R(key), params:{}, auto:false}; S.route=key; S.params={}; S.preview=false; render(); }
  else if(act==='clearSmart'){ S.smart=''; S.parsed=null; S.route=null; S.preview=false; render(); }
  else if(act==='open'||act==='copy'){ /* 阅读态：原型里不展开详情，保持只读 */ }
});

/* 输入 */
function bindInput(){
  screen.addEventListener('input', e=>{
    const el = e.target;
    if(el.dataset.in==='query'){ S.query = el.value; renderKeepFocus('[data-in="query"]', el.selectionStart); }
    else if(el.dataset.in==='smart'){
      S.smart = el.value;
      S.parsed = parseSmart(el.value);
      S.route = S.parsed ? S.parsed.route.id : null;
      S.params = S.parsed ? {...S.parsed.params} : {};
      S.preview = false; S.url=null;
      renderKeepFocus('[data-in="smart"]', el.selectionStart);
    }
    else if(el.dataset.param){
      const k = el.dataset.param;
      S.params[k] = el.value;
      if(S.parsed) S.parsed.params[k] = el.value;
      S.preview = false;
      // 只更新 state 面板，避免重绘打断输入
      document.getElementById('state').textContent = JSON.stringify({
        variant:S.variant, route:S.route||null, params:S.params, url:S.url, preview:S.preview,
        subscribedCount:S.subscribed.length, note:'typing…'
      }, null, 1);
    }
  });
}
function renderKeepFocus(sel, pos){
  render();
  const el = document.querySelector(sel);
  if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} }
}
bindInput();

/* 切换条 + 键盘 */
document.querySelectorAll('[data-nav]').forEach(b=>{
  b.addEventListener('click', ()=>go(parseInt(b.dataset.nav,10)));
});
window.addEventListener('keydown', e=>{
  const t = e.target;
  if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
  if(e.key==='ArrowLeft'){ go(-1); }
  else if(e.key==='ArrowRight'){ go(1); }
});

/* init */
const init = new URL(location.href).searchParams.get('variant');
if(init && VARIANTS[init.toUpperCase()]) S.variant = init.toUpperCase();
render();
</script>
</body>
