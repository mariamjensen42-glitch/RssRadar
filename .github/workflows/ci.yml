name: CI

on:
  # 只监听 dev 的 push：main 上的提交 100% 来自已经跑过本 workflow 的 PR，
  # 再跟一次是白跑一遍（同样 3 个 lint job + 单测）。合并后不重复验。
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  # 手动触发：push 事件偶发丢投递时，可在 Actions 页手动跑一遍单测
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :core:model:test :core:domain:test :core:data:testDebugUnitTest --stacktrace

  lint:
    runs-on: ubuntu-latest
    # 只在 PR→main 与手动触发时跑。push dev 时它本来就是 continue-on-error（不拦人），
    # 那一趟 6.8 分钟基本只是"看一眼"；lint 是合并前的守门，放在 PR 这一道就够。
    # 既然只在 PR 跑，continue-on-error 也没必要了 —— 这里失败必须拦下来。
    if: github.event_name != 'push'
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: app
            task: ":app"
            label: app
          - module: core/data
            task: ":core:data"
            label: core-data
          - module: core/ui
            task: ":core:ui"
            label: core-ui

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run Android Lint
        run: ./gradlew ${{ matrix.task }}:lintDebug --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-${{ matrix.label }}
          if-no-files-found: warn
          path: ${{ matrix.module }}/build/reports/lint-results-debug.*

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ matrix.module }}/build/reports/lint-results-debug.sarif
          category: lint-${{ matrix.label }}

# 这里曾有一个 instrumented-tests job（KVM + emulator 跑 :app:connectedDebugAndroidTest，仅 PR→main）。
# 它从未真正跑起来过 —— 每次只在检查列表里挂一条 skipping，看着像"还有东西在等"，
# 于是移除。要恢复的话：先把 emulator 跑通，再把 reactivecircus/android-emulator-runner 那段加回来
# （含 Enable KVM 那条 udev 规则），并给 unit-tests 加回 needs 依赖。
