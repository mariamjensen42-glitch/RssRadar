name: Release

on:
  push:
    tags: ['v*']
  # 手动 dry-run：不必等打 tag 就能验证 release 构建（R8）。走分支触发时跳过
  # tag 校验与 Draft Release 两步，只跑构建 + 签名校验。
  # 注意：workflow_dispatch 只能用默认分支上的 workflow 文件触发；在 dev 与 main
  # 同步 .github 之前，验证 release 只能靠打 tag。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION_NAME" != "$TAG" ]; then
            echo "tag $GITHUB_REF_NAME 与 build.gradle.kts 的 versionName $VERSION_NAME 不一致" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME 与 versionName $VERSION_NAME 一致"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # 这里刻意不跑单测（约 5 分钟）：
      # 1. ci.yml 每次 push dev 都跑过，能打 tag 的代码必然已过单测；
      # 2. 单测跑的是未混淆 debug 字节码，抓不到 R8 问题；
      # 3. release 侧的编译级断裂由 assembleRelease 自己暴露（R8 规则语法错、缺类都会让构建失败），
      #    运行时断裂靠下面的模拟器冒烟。

      # 密钥缺失时发 warning 并跳过（走 debug 签名），保证 dry-run 能验证 R8。
      # 真正发版前必须在仓库 Settings → Secrets 配齐下列 4 个变量。
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RSSRADAR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::RSSRADAR_KEYSTORE_BASE64 未配置 —— 本次回退 debug 签名，产物仅用于验证，不可发布"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rssradar-release.jks"
          echo "RSSRADAR_KEYSTORE_PATH=$RUNNER_TEMP/rssradar-release.jks" >> "$GITHUB_ENV"

      # 仓库 gradle.properties 的 -Xmx2048m 对「Kotlin 全量编译 + KSP + R8」太小，
      # GC 抖动明显。命令行 -D 的优先级高于 gradle.properties，这里放大到 6g，
      # 不改动仓库配置。runner 有 16GB 内存，留足余量给 R8。
      - name: Build release APK (R8)
        env:
          RSSRADAR_STORE_PASSWORD: ${{ secrets.RSSRADAR_STORE_PASSWORD }}
          RSSRADAR_KEY_ALIAS: ${{ secrets.RSSRADAR_KEY_ALIAS }}
          RSSRADAR_KEY_PASSWORD: ${{ secrets.RSSRADAR_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Compute SHA-256
        id: checksum
        working-directory: app/build/outputs/apk/release
        run: |
          sha256sum app-release.apk > SHA-256.txt
          echo "sha256=$(awk '{print $1}' SHA-256.txt)" >> "$GITHUB_OUTPUT"

      - name: Report APK size and R8 diagnostics
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SIZE=$(stat -c%s "$APK")
          MAPPING=app/build/outputs/mapping/release
          MISSING="$MAPPING/missing_rules.txt"

          echo "APK 体积：$(( SIZE / 1024 )) KiB（$SIZE bytes）"
          echo "mapping 目录内容："
          ls -1 "$MAPPING" 2>/dev/null || echo '(mapping 目录为空)'
          if [ -s "$MISSING" ]; then
            echo "### missing_rules.txt（R8 提示可能缺失的规则）"
            cat "$MISSING"
          else
            echo 'missing_rules.txt 不存在或为空 —— 未发现缺失的保留规则。'
          fi

          {
            echo "### Release 构建诊断"
            echo ''
            echo "- APK 体积：**$(( SIZE / 1024 )) KiB**（$SIZE bytes）"
            echo ''
            echo '```'
            ls -1 "$MAPPING" 2>/dev/null || echo '(mapping 目录为空)'
            echo '```'
            if [ -s "$MISSING" ]; then
              echo ''
              echo "### missing_rules.txt"
              echo ''
              echo 'R8 提示可能缺失的保留规则，逐条评估后补进 `app/src/main/keepRules/`。'
              echo ''
              echo '```'
              cat "$MISSING"
              echo '```'
            else
              echo ''
              echo 'missing_rules.txt 不存在或为空 —— 未发现缺失的保留规则。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 这里原本有模拟器冷启动冒烟，已移除：在 GitHub 免费 runner 上启动模拟器要 9~11 分钟
      # 且成功率极低（两轮均 Timeout waiting for emulator to boot），占掉流水线一半时间却
      # 从未成功跑完一次。R8 的运行时验证改为人工：首次开启 R8 / 改动 keep 规则后，装一次
      # Draft APK 走「订阅 → 刷新 → 阅读 → AI 摘要」即可（keep 规则稳定后风险极低）。
      # 需要自动化时，可用 reactivecircus/android-emulator-runner 加回本步骤，
      # 参数用最初那套已验证能启动的组合（api-level 34 / target default / profile pixel_6，
      # 不要加 cores、ram-size 与自定义 emulator-options——实测全是负优化）。

      - name: Draft release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo '## RssRadar ${{ github.ref_name }}'
            echo ''
            echo '自动发布（GitHub Actions）。'
            echo ''
            echo '- 版本号：`${{ github.ref_name }}`'
            echo '- APK 已通过签名构建（含 R8 代码优化与资源裁剪）与签名校验'
            echo '- SHA-256：`${{ steps.checksum.outputs.sha256 }}`'
            echo ''
            echo "### 变更（自 ${PREV:-首个提交} 起）"
            echo ''
            if [ -n "$PREV" ]; then
              git log --oneline --no-decorate "$PREV..HEAD"
            else
              git log --oneline --no-decorate
            fi
          } > /tmp/notes.txt

      - name: Create Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/SHA-256.txt --title "RssRadar ${{ github.ref_name }}" --notes-file /tmp/notes.txt --draft
